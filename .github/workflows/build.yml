name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # native arm64 runner: the Vulkan layer must match Armada OS (aarch64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zip tooling
        run: sudo apt-get update && sudo apt-get install -y zip unzip rsync

      - name: Run unit tests
        run: python3 -m pip install pytest && python3 -m pytest tests -q

      - name: Build plugin zip
        run: ./scripts/build-local.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: out/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.sha256
